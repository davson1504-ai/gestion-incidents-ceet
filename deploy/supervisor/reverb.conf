[program:gestion-incidents-ceet-reverb]
process_name=%(program_name)s
directory=/var/www/gestion-incidents-ceet/current
command=/usr/bin/php artisan reverb:start --host=127.0.0.1 --port=8080 --no-interaction
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/gestion-incidents-ceet-reverb.log
stopwaitsecs=30
